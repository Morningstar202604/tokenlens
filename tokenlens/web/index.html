<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TokenLens · AI Token 用量监控</title>
<style>
  :root{
    --bg:#080b12; --panel:#111725; --panel2:#161d2e; --line:#212a3d;
    --text:#e8eef8; --muted:#8e9bb3; --dim:#5f6b81;
    --accent:#3ddc97; --accent2:#6c7bff; --warn:#ffb454; --danger:#ff6b6b; --pink:#ff7ac6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(60,220,151,.10), transparent 60%),
      radial-gradient(800px 500px at 88% 0%, rgba(108,123,255,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:20px 22px 56px}
  a{color:var(--accent2)}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:6px 0 18px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:.3px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .brand small{color:var(--dim);font-weight:500;font-size:12px;letter-spacing:0}
  .live{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted)}
  .pill b{color:var(--text);font-weight:600}
  .pill .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:bp 1.8s infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .seg button.on{background:linear-gradient(135deg,rgba(60,220,151,.18),rgba(108,123,255,.18));color:var(--text)}
  select,input{
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none
  }
  .demo-tag{display:none;background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.4);color:var(--warn);
    border-radius:8px;padding:5px 10px;font-size:12px}
  body.is-demo .demo-tag{display:inline-block}

  /* ---------- 卡片 ---------- */
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px}
  .kpi .label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:26px;font-weight:700;margin-top:7px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .kpi .sub{color:var(--dim);font-size:11.5px;margin-top:3px}
  .kpi.a .value{color:var(--accent)} .kpi.b .value{color:var(--accent2)}
  .kpi.c .value{color:var(--pink)} .kpi.d .value{color:var(--warn)}
  .kpi.warn{border-color:rgba(255,107,107,.45);box-shadow:0 0 0 1px rgba(255,107,107,.12) inset}

  .row{grid-template-columns:1.55fr 1fr;margin-bottom:14px}
  @media(max-width:980px){.row{grid-template-columns:1fr}}
  .card h3{margin:0 0 2px;font-size:14px;font-weight:650}
  .card .hint{color:var(--dim);font-size:11.5px;margin-bottom:12px}
  .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}

  /* ---------- 预算 ---------- */
  .budget{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:760px){.budget{grid-template-columns:1fr}}
  .bar{height:8px;border-radius:99px;background:#1b2334;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .bar.ok > i{background:linear-gradient(90deg,var(--accent),#7ef2c0)}
  .bar.warn > i{background:linear-gradient(90deg,var(--warn),#ffd28a)}
  .bar.over > i{background:linear-gradient(90deg,var(--danger),#ff9b9b)}

  /* ---------- 排行 ---------- */
  .rank{display:flex;flex-direction:column;gap:11px}
  .rank .item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
  .rank .nm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .vl{color:var(--muted);font-variant-numeric:tabular-nums}
  .rank .track{grid-column:1/-1;height:6px;background:#1b2334;border-radius:99px;overflow:hidden}
  .rank .track > i{display:block;height:100%;border-radius:99px}
  .empty{color:var(--dim);font-size:12.5px;padding:14px 0;text-align:center}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid rgba(33,42,61,.55);font-variant-numeric:tabular-nums}
  tr:hover td{background:rgba(108,123,255,.05)}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;border:1px solid var(--line);color:var(--muted)}
  .tag.ok{color:var(--accent);border-color:rgba(60,220,151,.35);background:rgba(60,220,151,.08)}
  .tag.err{color:var(--danger);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.08)}
  .tag.stream{color:var(--accent2);border-color:rgba(108,123,255,.35);background:rgba(108,123,255,.08)}
  .tag.est{color:var(--warn);border-color:rgba(255,180,84,.3);background:rgba(255,180,84,.07)}
  .scroll{max-height:430px;overflow:auto}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);align-items:center}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
  .foot{color:var(--dim);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.8}
  code{background:#0d1320;border:1px solid var(--line);border-radius:6px;padding:1.5px 6px;font-size:11.5px;color:#a8b6cc}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="dot"></span>TokenLens <small>AI Token 用量监控</small></div>
    <span class="demo-tag">离线预览 · 演示数据</span>
    <div class="live">
      <span class="pill"><span class="pulse"></span>实时 <b id="live-rpm">0</b> req/min</span>
      <span class="pill">近 60s <b id="live-tokens">0</b> tokens</span>
      <div class="seg" id="range">
        <button data-r="24h" class="on">24 小时</button>
        <button data-r="today">今日</button>
        <button data-r="7d">7 天</button>
        <button data-r="30d">30 天</button>
        <button data-r="all">全部</button>
      </div>
      <select id="f-project"><option value="">全部项目</option></select>
      <select id="f-model"><option value="">全部模型</option></select>
    </div>
  </div>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid budget">
    <div class="card">
      <div class="chead"><div><h3>今日预算</h3><div class="hint" id="bud-d-sub">—</div></div><div id="bud-d-pct" style="font-size:15px;font-weight:700">—</div></div>
      <div class="bar ok" id="bud-d-bar"><i style="width:0%"></i></div>
    </div>
    <div class="card">
      <div class="chead"><div><h3>本月预算</h3><div class="hint" id="bud-m-sub">—</div></div><div id="bud-m-pct" style="font-size:15px;font-weight:700">—</div></div>
      <div class="bar ok" id="bud-m-bar"><i style="width:0%"></i></div>
    </div>
  </div>

  <div class="grid row">
    <div class="card">
      <div class="chead">
        <div><h3>用量趋势</h3><div class="hint" id="trend-hint">按小时聚合</div></div>
        <div class="seg" id="metric">
          <button data-m="cost" class="on">成本</button>
          <button data-m="total_tokens">Tokens</button>
          <button data-m="requests">请求数</button>
          <button data-m="avg_latency">延迟</button>
        </div>
      </div>
      <div id="chart"></div>
      <div class="legend" style="margin-top:8px">
        <span><i style="background:var(--accent)"></i><span id="lg-name">成本 (USD)</span></span>
        <span style="margin-left:auto" id="trend-total"></span>
      </div>
    </div>
    <div class="card">
      <div class="chead">
        <div><h3>成本构成</h3><div class="hint">按维度排行</div></div>
        <div class="seg" id="dim">
          <button data-d="model" class="on">模型</button>
          <button data-d="project">项目</button>
          <button data-d="provider">厂商</button>
        </div>
      </div>
      <div class="rank" id="rank"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="chead">
      <div><h3>调用明细</h3><div class="hint">最近 100 条 · 悬停查看完整信息</div></div>
      <span class="pill" id="tbl-count">0 条</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>时间</th><th>项目</th><th>模型</th><th>端点</th>
          <th style="text-align:right">输入</th><th style="text-align:right">输出</th>
          <th style="text-align:right">缓存</th><th style="text-align:right">成本</th>
          <th style="text-align:right">延迟</th><th style="text-align:right">首字</th><th>状态</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="foot">
    TokenLens · 把 <code>OPENAI_BASE_URL</code> 指向本地代理即可零侵入接入<br>
    数据存于本地 SQLite，不出本机
  </div>
</div>

const S = { range:'24h', project:'', model:'', metric:'cost', dim:'model', offline:false };
const RATE = 7.2;

const $ = id => document.getElementById(id);
const fmt = n => {
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
};
const usd = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:4, maximumFractionDigits:4});
const cny = n => '¥' + ((Number(n)||0)*RATE).toLocaleString('zh-CN',{minimumFractionDigits:2, maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path){
  const r = await fetch(path, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function loadAll(){
  if(S.offline) return pickDemo();
  const q = `rng=${S.range}` + (S.project?`&project=${encodeURIComponent(S.project)}`:'')
          + (S.model?`&model=${encodeURIComponent(S.model)}`:'');
  try{
    const [stats, ts, rank, recent, budget, filters] = await Promise.all([
      api('/api/stats?'+q), api('/api/timeseries?'+q),
      api(`/api/breakdown?field=${S.dim}&${q}`), api('/api/recent?limit=100&'+q),
      api('/api/budget'), api('/api/filters')
    ]);
    let live = {rpm:0,tokens:0};
    try{ live = await api('/api/live?window=60'); }catch(e){}
    return {stats, ts, rank, recent, budget, filters, live};
  }catch(e){
    const demo = pickDemo();
    if(!demo) throw e;
    S.offline = true; document.body.classList.add('is-demo');
    return demo;
  }
}

/* 离线时从内嵌演示数据里取对应时间范围的快照 */
function pickDemo(){
  if(!DEMO_DATA) return null;
  return DEMO_DATA[S.range] || DEMO_DATA['24h'] || DEMO_DATA;
}

async function refresh(){
  const d = await loadAll();
  window.__ts = d.ts || [];
  renderKpis(d.stats, d.budget);
  renderBudget(d.budget);
  renderChart(d.ts);
  renderRank(Array.isArray(d.rank) ? d.rank : ((d.rank||{})[S.dim] || []));
  renderRows(d.recent);
  renderFilters(d.filters);
  if(d.live){ $('live-rpm').textContent = d.live.rpm ?? 0; $('live-tokens').textContent = fmt(d.live.tokens); }
}

/* ---------- KPI ---------- */
function renderKpis(s, budget){
  const over = (budget && budget.daily && budget.daily.alert) ? 'warn' : '';
  const cards = [
    {c:'a', label:'请求数', value:fmt(s.requests), sub:`流式 ${fmt(s.streamed)} · 错误 ${s.errors||0}`},
    {c:'b', label:'总 Tokens', value:fmt(s.total_tokens), sub:`输入 ${fmt(s.prompt_tokens)} · 输出 ${fmt(s.completion_tokens)}`},
    {c:'c', label:'成本', value:usd(s.cost), sub:cny(s.cost) + (s.cached_tokens?` · 缓存命中 ${fmt(s.cached_tokens)}`:'')},
    {c:'d', label:'错误率', value:((s.error_rate||0)*100).toFixed(2)+'%', sub:`${s.errors||0} / ${s.requests||0} 次失败`},
    {c:'', label:'平均延迟', value:(Math.round(s.avg_latency||0))+' ms', sub:`P95 ${Math.round(s.p95_latency||0)} ms`},
    {c:'', label:'首字延迟', value:(Math.round(s.avg_ttft||0))+' ms', sub:'仅统计流式请求'},
  ];
  $('kpis').innerHTML = cards.map(k=>`
    <div class="card kpi ${k.c} ${over&&k.c==='c'?over:''}">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}</div>
      <div class="sub">${k.sub}</div>
    </div>`).join('');
  if(over) document.querySelectorAll('.kpi')[2].classList.add('warn');
}

/* ---------- 预算 ---------- */
function bar(el, st, isMoney){
  const pct = st.limit ? Math.min(st.spent/st.limit*100, 100) : 0;
  el.className = 'bar ' + (st.exceeded ? 'over' : (st.ratio>=0.8 ? 'warn' : 'ok'));
  el.firstElementChild.style.width = pct.toFixed(1)+'%';
}
function renderBudget(b){
  const d = b.daily||{}, m = b.monthly||{};
  bar($('bud-d-bar'), d); bar($('bud-m-bar'), m);
  $('bud-d-sub').textContent = d.limit ? `${usd(d.spent)} / ${usd(d.limit)} · 剩余 ${usd(d.remaining)}` : '未设置日预算';
  $('bud-m-sub').textContent = m.limit ? `${usd(m.spent)} / ${usd(m.limit)} · 剩余 ${usd(m.remaining)}` : '未设置月预算';
  $('bud-d-pct').textContent = d.limit ? Math.round(d.ratio*100)+'%' : '—';
  $('bud-m-pct').textContent = m.limit ? Math.round(m.ratio*100)+'%' : '—';
}

/* ---------- 趋势图（纯 SVG，无外部依赖） ---------- */
const METRICS = {
  cost:{name:'成本 (USD)', color:'#3ddc97', fmt:usd},
  total_tokens:{name:'Tokens', color:'#6c7bff', fmt:fmt},
  requests:{name:'请求数', color:'#ff7ac6', fmt:fmt},
  avg_latency:{name:'延迟 (ms)', color:'#ffb454', fmt:v=>Math.round(v)+' ms'},
};
function renderChart(ts){
  const data = (ts||[]).filter(x=>x);
  const M = METRICS[S.metric];
  $('lg-name').textContent = M.name;
  const host = $('chart');
  if(!data.length){ host.innerHTML = '<div class="empty">暂无数据</div>'; $('trend-total').textContent=''; return; }

  const W=760, H=250, PL=52, PR=14, PT=16, PB=30;
  const iw = W-PL-PR, ih = H-PT-PB;
  const vals = data.map(d=>Number(d[S.metric])||0);
  const max = Math.max(...vals, 0.0001), min = 0;
  const x = i => PL + (data.length===1 ? iw/2 : i*iw/(data.length-1));
  const y = v => PT + ih - (v-min)/(max-min)*ih;

  const pts = vals.map((v,i)=>[x(i), y(v)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${x(data.length-1).toFixed(1)} ${PT+ih} L ${PL} ${PT+ih} Z`;

  // 网格 + Y 轴刻度
  let grid='';
  for(let g=0; g<=4; g++){
    const v = min + (max-min)*g/4, yy = y(v);
    grid += `<line x1="${PL}" y1="${yy.toFixed(1)}" x2="${W-PR}" y2="${yy.toFixed(1)}" stroke="#212a3d" stroke-width="1"/>`
         +  `<text x="${PL-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" fill="#5f6b81" font-size="10">${M.fmt(v)}</text>`;
  }
  // X 轴标签抽稀
  const step = Math.max(1, Math.ceil(data.length/7));
  let xlab='';
  data.forEach((d,i)=>{
    if(i%step && i!==data.length-1) return;
    const t = (d.bucket||'').slice(-5);
    xlab += `<text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" fill="#5f6b81" font-size="10">${t}</text>`;
  });
  // 数据点
  const dots = (data.length<=40) ? pts.map((p,i)=>
    `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#0b111c" stroke="${M.color}" stroke-width="1.6"><title>${esc(data[i].bucket)} · ${M.fmt(vals[i])}</title></circle>`).join('') : '';

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:250px;display:block">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${M.color}" stop-opacity="0.34"/>
      <stop offset="1" stop-color="${M.color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${M.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
  </svg>`;
  const total = vals.reduce((a,b)=>a+b,0);
  $('trend-total').textContent = (S.metric==='avg_latency' ? '平均 ' : '合计 ')
    + (S.metric==='avg_latency' ? Math.round(total/vals.length)+' ms' : M.fmt(total));
  $('trend-hint').textContent = (S.range==='30d'||S.range==='all') ? '按天聚合' : '按小时聚合';
}

/* ---------- 排行 ---------- */
const COLORS = ['#3ddc97','#6c7bff','#ff7ac6','#ffb454','#7ef2c0','#9aa7ff','#ffa8dc','#ffd28a'];
function renderRank(rows){
  const host = $('rank');
  if(!rows || !rows.length){ host.innerHTML='<div class="empty">暂无数据</div>'; return; }
  const max = Math.max(...rows.map(r=>Number(r.cost)||0), 0.000001);
  host.innerHTML = rows.map((r,i)=>{
    const pct = (Number(r.cost)/max*100).toFixed(1);
    return `<div class="item">
      <div class="nm" title="${esc(r.name)}">${esc(r.name)}</div>
      <div class="vl">${usd(r.cost)} · ${fmt(r.total_tokens)} tok · ${r.requests} 次</div>
      <div class="track"><i style="width:${pct}%;background:${COLORS[i%COLORS.length]}"></i></div>
    </div>`;
  }).join('');
}

/* ---------- 明细 ---------- */
function renderRows(rows){
  const host = $('rows');
  if(!rows || !rows.length){ host.innerHTML='<tr><td colspan="11" class="empty">暂无数据</td></tr>'; $('tbl-count').textContent='0 条'; return; }
  $('tbl-count').textContent = rows.length + ' 条';
  host.innerHTML = rows.map(r=>{
    const dt = new Date(r.ts*1000);
    const time = dt.toLocaleTimeString('zh-CN',{hour12:false}) + ' ' + dt.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
    const ok = r.status < 400;
    return `<tr title="${esc(r.error||r.upstream||'')}">
      <td style="color:var(--dim)">${time}</td>
      <td>${esc(r.project||'-')}</td>
      <td>${esc(r.model||'-')}</td>
      <td style="color:var(--muted)">${esc((r.endpoint||'').replace(/^\//,''))}${r.is_stream?' <span class="tag stream">流式</span>':''}</td>
      <td style="text-align:right">${fmt(r.prompt_tokens)}</td>
      <td style="text-align:right">${fmt(r.completion_tokens)}</td>
      <td style="text-align:right;color:var(--dim)">${r.cached_tokens?fmt(r.cached_tokens):'-'}</td>
      <td style="text-align:right">${usd(r.cost)}${r.cost_source==='estimated'?' <span class="tag est">估</span>':''}</td>
      <td style="text-align:right">${Math.round(r.latency_ms)} ms</td>
      <td style="text-align:right;color:var(--dim)">${r.ttft_ms?Math.round(r.ttft_ms)+' ms':'-'}</td>
      <td><span class="tag ${ok?'ok':'err'}">${r.status}</span></td>
    </tr>`;
  }).join('');
}

function renderFilters(f){
  if(!f) return;
  const fill = (sel, items, cur) => {
    const el = $(sel);
    const keep = el.value;
    el.innerHTML = '<option value="">' + (sel==='f-project'?'全部项目':'全部模型') + '</option>'
      + (items||[]).map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
    el.value = S[sel==='f-project'?'project':'model'] || '';
  };
  fill('f-project', f.projects); fill('f-model', f.models);
}

/* ---------- 交互 ---------- */
function bindSeg(id, key, cb){
  $(id).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    [...$(id).children].forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S[key] = b.dataset[key==='metric'?'m':(key==='dim'?'d':'r')];
    cb && cb();
  });
}
bindSeg('range','range', refresh);
bindSeg('metric','metric', ()=>renderChart(window.__ts||[]));
bindSeg('dim','dim', refresh);
$('f-project').addEventListener('change', e=>{ S.project=e.target.value; refresh(); });
$('f-model').addEventListener('change', e=>{ S.model=e.target.value; refresh(); });

refresh();
setInterval(()=>{ if(!S.offline) refresh(); }, 15000);
</script>
</body>
